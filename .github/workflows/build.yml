name: Docker KernelSU Next Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zyc3688/kernel_build:latest

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Inject KernelSU Next & Build
      run: |
        # KernelSU Next Setup
        curl -LSs "https://raw.githubusercontent.com/rifs28/KernelSU-Next/next/kernel/setup.sh" | bash -s next
        
        # Enable Configs
        DEFCONFIG="kernel-4.9/arch/arm64/configs/oppo6765_defconfig"
        echo "CONFIG_KPROBES=y" >> $DEFCONFIG
        echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
        echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
        echo "CONFIG_OVERLAY_FS=y" >> $DEFCONFIG
        echo "CONFIG_NETFILTER=y" >> $DEFCONFIG

        # Direct Compilation
        cd kernel-4.9
        make O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android- oppo6765_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-android-

    - name: Package AnyKernel3
      run: |
        git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
        cp kernel-4.9/out/arch/arm64/boot/Image* AnyKernel3/ 2>/dev/null || true
        cd AnyKernel3
        zip -r9 ../KernelSU_Next_OppoA15s.zip * -x .git* README.md

    - name: Upload Zip
      uses: actions/upload-artifact@v4
      with:
        name: Oppo-A15s-KernelSU-Next
        path: KernelSU_Next_OppoA15s.zip
