name: Build KernelSU Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build Kernel
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: https://github.com/amirfoysal720-dotcom/A15
          kernel-branch: main
          config: oppo6765_defconfig
          arch: arm64
          aarch64-compiler: gcc
          ksu: true
          ksu-version: main
          extra-make-args: -C kernel-4.9
